name: Native builds and model tests
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev ffmpeg libmpv2
      - if: runner.os == 'macOS'
        run: brew install ffmpeg mpv
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/bootstrap-runtime.ps1
          cargo test --locked --test media_pipeline -- --ignored --nocapture --test-threads=1
          cargo test --locked --test media_edges -- --ignored --nocapture --test-threads=1
          ./scripts/package-windows.ps1
      - if: runner.os != 'Windows'
        run: sh scripts/package-unix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SVBB-${{ runner.os }}
          path: artifacts/
