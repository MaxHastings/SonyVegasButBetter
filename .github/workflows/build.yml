name: Native builds and model tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev ffmpeg libmpv2
      - if: runner.os == 'macOS'
        run: brew install ffmpeg mpv
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/bootstrap-runtime.ps1
          cargo test --release --locked --test media_pipeline -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Media pipeline tests failed' }
          cargo test --release --locked --test media_edges -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Media edge tests failed' }
          cargo test --release --locked --test preview_requests -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Preview request tests failed' }
          cargo test --release --locked --test size_limit -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Size limit tests failed' }
          cargo test --release --locked --test crop_pipeline -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Crop pipeline tests failed' }
          ./scripts/package-windows-release.ps1
          $packages = @(Get-ChildItem artifacts -Directory -Filter '*-first-run')
          if ($packages.Count -ne 1) { throw 'Expected one public Windows package' }
          $package = $packages[0].FullName
          New-Item -ItemType Directory (Join-Path $package '.setup-cache') | Out-Null
          $manifest = Get-Content runtime-manifest.json -Raw | ConvertFrom-Json
          foreach ($item in $manifest.archives) { Copy-Item (Join-Path 'runtime' $item.file) (Join-Path $package '.setup-cache') }
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $package 'setup-runtime.ps1') -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw 'Public first-run setup failed' }
      - if: runner.os != 'Windows'
        run: sh scripts/package-unix.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        with:
          name: SVBB-${{ runner.os }}
          path: artifacts/*-first-run.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && runner.os != 'Windows'
        with:
          name: SVBB-${{ runner.os }}
          path: artifacts/
